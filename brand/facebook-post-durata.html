<!DOCTYPE html>

<head>

<title>AutoAct · post durata</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #dadce0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .cadru { width: 1080px; height: 1080px; overflow: hidden; position: relative; background: #f8f9fa; }
</style>
</head>
<body>
  <div class="cadru">

    <div style="width:100%;height:100%;background:#f8f9fa;padding:84px;display:flex;flex-direction:column;justify-content:center;gap:40px;">
      <div style="display:flex;align-items:center;gap:20px;">
        <div style="width:84px;height:84px;"><svg xmlns="http://www.w3.org/2000/svg" width="84" height="84" viewBox="0 0 512 512" role="img" aria-label="AutoAct">
  <defs>
    <linearGradient id="aa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#1558b0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#aa)"/>

    <path d="M150 116 L300 116 L362 178 L362 396 A20 20 0 0 1 342 416 L170 416 A20 20 0 0 1 150 396 Z"
          fill="#ffffff" opacity="1"/>
    <!-- colțul îndoiat -->
    <path d="M300 116 L362 178 L318 178 A18 18 0 0 1 300 160 Z"
          fill="#1558b0" opacity="0.28"/>
    <!-- rândurile de text: actul e deja completat -->
    <g stroke="#dadce0" stroke-width="13" stroke-linecap="round">
      <line x1="196" y1="232" x2="316" y2="232"/>
      <line x1="196" y1="278" x2="316" y2="278"/>
    </g>
    <!-- bifă: verificat -->
    <circle cx="256" cy="352" r="56" fill="#188038"/>
    <path d="M226 352 L248 374 L288 330" fill="none" stroke="#ffffff"
          stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg></div>
        <div style="font:700 30px/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#202124;">AutoAct</div>
      </div>
      <div style="font:800 76px/1.06 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#202124;">Fotografezi actele.<br><span style="color:#1a73e8;">Primești dosarul gata.</span></div>
      <div style="font:500 32px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#5f6368;max-width:820px;">Contract de vânzare-cumpărare, cerere DRPCIV și declarații fiscale — generate automat din pozele documentelor.</div>
      <div style="display:flex;gap:16px;">
        <div style="background:#1a73e8;color:#ffffff;font:700 28px/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:22px 34px;border-radius:12px;">49 RON</div>
        <div style="background:#e6f4ea;color:#188038;font:700 28px/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:22px 34px;border-radius:12px;border:2px solid #188038">Zero întrebări</div>
      </div>
    </div>
