name: CI AutoAct

# Rulează pe orice push (toate branch-urile) și pe pull request-uri.
# Zero dependențe npm: CI-ul nu instalează nimic, doar Node.js.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  teste:
    name: Toate suitele (CNP · UI↔n8n · șabloane · builder-e · scheme)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Suita completă (ruleaza-teste.sh)
        run: bash ruleaza-teste.sh
